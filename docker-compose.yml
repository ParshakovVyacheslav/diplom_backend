services:
  web:
    build: .
    command: 
      - sh
      - -c
      - >
        python manage.py collectstatic --noinput &&
        python manage.py migrate && 
        python manage.py runserver 0.0.0.0:8000
    volumes:
      - static:/app/staticfiles
    expose: 
      - "8000"

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static:/app/staticfiles
    depends_on:
      - web

volumes:
  static:

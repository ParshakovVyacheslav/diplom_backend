services:
  web:
    build: .
    command: 
      - sh
      - -c
      - >
        python manage.py collectstatic --noinput &&
        python manage.py migrate &&
        python create_superuser.py &&
        python manage.py runserver 0.0.0.0:8000
    volumes:
      - static:/app/staticfiles
    expose: 
      - "8000"
    env_file:
    - .env
    environment:
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-root}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-root@root.root}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-root}

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/admin-allow.conf:/etc/nginx/admin-allow.conf:ro
      - static:/app/staticfiles
    depends_on:
      - web

volumes:
  static:

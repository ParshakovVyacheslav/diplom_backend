definitions:
  Meal:
    required:
    - product
    - name
    type: object
    properties:
      id:
        title: ID
        type: integer
        readOnly: true
      product:
        title: Продукт
        type: integer
      name:
        title: Название приема пищи
        type: string
        maxLength: 255
        minLength: 1
      amount:
        title: Количество порций
        type: integer
        maximum: 9223372036854775807
        minimum: -9223372036854775808
      position:
        title: Порядковый номер
        type: integer
        maximum: 9223372036854775807
        minimum: -9223372036854775808
      date:
        title: Дата приема пищи
        type: string
        format: date-time
        readOnly: true
      calories:
        title: Калории (ккал)
        type: integer
        readOnly: true
        x-nullable: true
      protein:
        title: Белки (г)
        type: number
        readOnly: true
      carbohydrates:
        title: Углеводы (г)
        type: number
        readOnly: true
      fats:
        title: Жиры (г)
        type: number
        readOnly: true
  Product:
    required:
    - name
    type: object
    properties:
      id:
        title: ID
        type: integer
        readOnly: true
      name:
        title: Название
        type: string
        maxLength: 255
        minLength: 1
      extra_info:
        title: Дополнительная информация
        type: string
      net_weight:
        title: Вес нетто (г)
        type: number
      number_of_servings:
        title: Количество порций
        type: integer
        maximum: 9223372036854775807
        minimum: -9223372036854775808
      producer:
        title: Производитель
        type: string
        maxLength: 255
      product_category:
        title: Категория продукта
        type: string
        maxLength: 100
      calories:
        title: Калории (ккал)
        type: integer
        maximum: 9223372036854775807
        minimum: -9223372036854775808
        x-nullable: true
      protein:
        title: Белки (г)
        type: number
      carbohydrates:
        title: Углеводы (г)
        type: number
      fats:
        title: Жиры (г)
        type: number
  TokenObtainPair:
    required:
    - username
    - password
    type: object
    properties:
      username:
        title: Username
        type: string
        minLength: 1
      password:
        title: Password
        type: string
        minLength: 1
  TokenRefresh:
    required:
    - refresh
    type: object
    properties:
      refresh:
        title: Refresh
        type: string
        minLength: 1
      access:
        title: Access
        type: string
        readOnly: true
        minLength: 1
  TokenVerify:
    required:
    - token
    type: object
    properties:
      token:
        title: Token
        type: string
        minLength: 1
  User:
    type: object
    properties:
      email:
        title: Адрес электронной почты
        type: string
        format: email
        readOnly: true
        minLength: 1
      id:
        title: ID
        type: integer
        readOnly: true
  CustomUserCreate:
    required:
    - email
    - password
    type: object
    properties:
      email:
        title: Адрес электронной почты
        type: string
        format: email
        maxLength: 254
        minLength: 1
      password:
        title: Password
        type: string
        minLength: 1
  Activation:
    required:
    - uid
    - token
    type: object
    properties:
      uid:
        title: Uid
        type: string
        minLength: 1
      token:
        title: Token
        type: string
        minLength: 1
  SendEmailReset:
    required:
    - email
    type: object
    properties:
      email:
        title: Email
        type: string
        format: email
        minLength: 1
  PasswordResetConfirm:
    required:
    - uid
    - token
    - new_password
    type: object
    properties:
      uid:
        title: Uid
        type: string
        minLength: 1
      token:
        title: Token
        type: string
        minLength: 1
      new_password:
        title: New password
        type: string
        minLength: 1
  UsernameResetConfirm:
    required:
    - new_email
    type: object
    properties:
      new_email:
        title: Адрес электронной почты
        type: string
        format: email
        maxLength: 254
        minLength: 1
  SetPassword:
    required:
    - new_password
    - current_password
    type: object
    properties:
      new_password:
        title: New password
        type: string
        minLength: 1
      current_password:
        title: Current password
        type: string
        minLength: 1
  SetUsername:
    required:
    - current_password
    - new_email
    type: object
    properties:
      current_password:
        title: Current password
        type: string
        minLength: 1
      new_email:
        title: Адрес электронной почты
        type: string
        format: email
        maxLength: 254
        minLength: 1

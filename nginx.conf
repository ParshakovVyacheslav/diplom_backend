limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=50r/s;

server {
    listen 80;
    server_name rice-fitness-app.ru www.rice-fitness-app.ru;

    # Для выпуска/продления Let's Encrypt (certbot webroot): раскомментируйте и примонтируйте ./certbot-www
    # location /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name rice-fitness-app.com www.rice-fitness-app.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_conf_command Options NO_RENEGOTIATION;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /admin/ {
        include /etc/nginx/admin-allow.conf;
        deny all;
        proxy_pass http://web:8000;
    }

    location /auth/ {
        limit_req zone=auth_limit burst=50 delay=20;
        proxy_pass http://web:8000;
    }

    location /api/ {
        limit_req zone=api_limit burst=100 delay=50;
        proxy_pass http://web:8000;
    }

    location / {
        proxy_pass http://web:8000;
    }
}

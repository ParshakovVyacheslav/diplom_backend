services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-diplom}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-diplom}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: ${DOCKERHUB_USERNAME}/diplom:latest
    restart: unless-stopped
    command:
      - sh
      - -c
      - >
        python manage.py collectstatic --noinput &&
        python manage.py migrate &&
        python create_superuser.py &&
        python manage.py runserver 0.0.0.0:8000
    volumes:
      - static:/app/staticfiles
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-root}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-root@root.root}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-root}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/admin-allow.conf:/etc/nginx/admin-allow.conf:ro
      - static:/app/staticfiles
      # Положите сюда fullchain.pem и privkey.pem (Let's Encrypt или свой ЦС).
      - ./ssl:/etc/nginx/ssl:ro
      # Раскомментируйте для certbot webroot и раскомментируйте location в nginx.conf:
      # - ./certbot-www:/var/www/certbot:ro
    depends_on:
      - web

volumes:
  static:
  postgres_data:

